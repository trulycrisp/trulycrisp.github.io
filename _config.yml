title: Truly Crisp
remote_theme: "mmistakes/minimal-mistakes@4.28.1"
minimal_mistakes_skin: catppuccin_mocha

plugins:
- jekyll-include-cache
- jekyll-feed

defaults:
  - scope:
      path: ""
    values:
      layout: single
      author_profile: false
      toc: true
      toc_sticky: true
      enable_copy_code_button: true
